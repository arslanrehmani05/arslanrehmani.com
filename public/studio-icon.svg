<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Warm Sanity Terracotta / Coral Studio Gradient -->
    <linearGradient id="studio-coral-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A60" />
      <stop offset="50%" stop-color="#F03E2F" />
      <stop offset="100%" stop-color="#B82215" />
    </linearGradient>

    <!-- Glowing Terracotta Radial Accent -->
    <radialGradient id="studio-glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F03E2F" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    
    <!-- Obsidian Container Background Gradient -->
    <radialGradient id="studio-bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161413" />
      <stop offset="100%" stop-color="#090808" />
    </radialGradient>
  </defs>

  <!-- Outer squircle background with studio coral border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#studio-bg-grad)" stroke="url(#studio-coral-grad)" stroke-width="1.2" stroke-opacity="0.85" />
  
  <!-- Subtle inner glow background -->
  <circle cx="16" cy="16" r="12" fill="url(#studio-glow-grad)" />

  <!-- Inner perimeter frame -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="none" stroke="#F03E2F" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Studio Starburst Emblem Motif -->
  <g stroke="url(#studio-coral-grad)" stroke-linecap="round" stroke-width="1.8">
    <!-- Vertical & Horizontal Primary Rays -->
    <line x1="16" y1="7.5" x2="16" y2="24.5" />
    <line x1="7.5" y1="16" x2="24.5" y2="16" />
    
    <!-- Diagonal Secondary Rays -->
    <line x1="10" y1="10" x2="22" y2="22" />
    <line x1="22" y1="10" x2="10" y2="22" />

    <!-- Interstitial Fine Rays -->
    <line x1="13" y1="8" x2="19" y2="24" stroke-width="1.2" opacity="0.8" />
    <line x1="8" y1="13" x2="24" y2="19" stroke-width="1.2" opacity="0.8" />
    <line x1="19" y1="8" x2="13" y2="24" stroke-width="1.2" opacity="0.8" />
    <line x1="24" y1="13" x2="8" y2="19" stroke-width="1.2" opacity="0.8" />
  </g>
  
  <!-- Center Core Node -->
  <circle cx="16" cy="16" r="1.5" fill="#FFB0A0" />
</svg>
