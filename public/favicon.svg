<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Executive Metallic Gold Linear Gradient -->
    <linearGradient id="ar-site-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="45%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    
    <!-- Deep Obsidian Radial Background Gradient -->
    <radialGradient id="ar-site-bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </radialGradient>
  </defs>

  <!-- Outer squircle background with gold precision border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#ar-site-bg-grad)" stroke="url(#ar-site-gold-grad)" stroke-width="1.2" stroke-opacity="0.9" />
  
  <!-- Subtle inner perimeter frame for executive depth -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Studio Emblem Motif in Executive Site Gold & Off-White -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 21.5 12 C 21.5 9.8, 18.5 8.5, 16 8.5 C 12.5 8.5, 10.5 10.8, 10.5 13 C 10.5 17, 21.5 15.5, 21.5 19.5 C 21.5 22, 19 23.5, 16 23.5 C 12.8 23.5, 10.2 21.8, 10.2 19.5" stroke="url(#ar-site-gold-grad)" stroke-width="2.2" />
    <path d="M 21.5 8.5 L 23.5 6.5" stroke="#F5F5F0" stroke-width="1.8" />
  </g>
  
  <circle cx="23.5" cy="6.5" r="1.1" fill="#F3E5AB" />
</svg>
