<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Metallic Gold Linear Gradient -->
    <linearGradient id="ar-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="45%" stop-color="#C9A84C" />
      <stop offset="100%" stop-color="#9A7B2C" />
    </linearGradient>
    
    <!-- Deep Obsidian Radial Background Gradient -->
    <radialGradient id="ar-bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#080808" />
    </radialGradient>
  </defs>

  <!-- Outer squircle background with gold precision border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#ar-bg-grad)" stroke="url(#ar-gold-grad)" stroke-width="1.2" stroke-opacity="0.85" />
  
  <!-- Subtle inner perimeter frame for executive depth -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.25" />

  <!-- Monogram Mark "AR" -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 'A' Left Diagonal Stem -->
    <path d="M 9 22.5 L 15 9.5" stroke="#F5F5F0" stroke-width="2.2" />
    
    <!-- Central Shared Vertical Stem ('A' & 'R') -->
    <path d="M 15 9.5 V 22.5" stroke="#F5F5F0" stroke-width="2.2" />
    
    <!-- 'A' Signature Gold Crossbar -->
    <path d="M 11 17.5 H 18.5" stroke="url(#ar-gold-grad)" stroke-width="2" />
    
    <!-- 'R' Precision Gold Upper Loop -->
    <path d="M 15 9.5 H 20 C 22.8 9.5, 22.8 15.5, 20 15.5 H 15" stroke="url(#ar-gold-grad)" stroke-width="2" />
    
    <!-- 'R' Dynamic Gold Diagonal Leg -->
    <path d="M 17.5 15.5 L 23 22.5" stroke="url(#ar-gold-grad)" stroke-width="2.2" />
  </g>
  
  <!-- Signature Precision Node at Apex -->
  <circle cx="15" cy="9.5" r="1.1" fill="#F3E5AB" />
</svg>
