<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      :root {
        --bg-color: #111113;
        --border-color: rgba(255, 255, 255, 0.22);
        --inner-frame: rgba(255, 255, 255, 0.10);
        --glyph-color: #f0f0f2;
        --accent-color: #ffffff;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-color: #f7f7f8;
          --border-color: rgba(0, 0, 0, 0.14);
          --inner-frame: rgba(0, 0, 0, 0.06);
          --glyph-color: #000000;
          --accent-color: #111113;
        }
      }
      .bg-rect {
        fill: var(--bg-color);
        stroke: var(--border-color);
        stroke-width: 1.2px;
      }
      .inner-frame {
        stroke: var(--inner-frame);
        stroke-width: 0.5px;
      }
      .mark-stem {
        stroke: var(--glyph-color);
        stroke-width: 2.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mark-accent {
        stroke: var(--accent-color);
        stroke-width: 2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .mark-leg {
        stroke: var(--accent-color);
        stroke-width: 2.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .apex-node {
        fill: var(--accent-color);
      }
    </style>
  </defs>

  <!-- Outer Squircle Tile -->
  <rect x="1" y="1" width="30" height="30" rx="7" class="bg-rect" />

  <!-- Subtle Inner Perimeter Frame for Executive Depth -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="none" class="inner-frame" />

  <!-- Signature Monogram Mark -->
  <g fill="none">
    <!-- 'A' Left Diagonal Stem -->
    <path d="M 9 22.5 L 15 9.5" class="mark-stem" />

    <!-- Central Shared Vertical Stem -->
    <path d="M 15 9.5 V 22.5" class="mark-stem" />

    <!-- 'A' Crossbar -->
    <path d="M 11 17.5 H 18.5" class="mark-accent" />

    <!-- 'R' Precision Upper Loop -->
    <path d="M 15 9.5 H 20 C 22.8 9.5, 22.8 15.5, 20 15.5 H 15" class="mark-accent" />

    <!-- 'R' Dynamic Diagonal Leg -->
    <path d="M 17.5 15.5 L 23 22.5" class="mark-leg" />
  </g>

  <!-- Signature Precision Node at Apex -->
  <circle cx="15" cy="9.5" r="1.1" class="apex-node" />
</svg>
